name: Verify Architect Runner Integration v3.3.2+
on:
  push:
  pull_request:

jobs:
  linux-architect-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install and verify deterministic Architect runner
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/opencode-v332";unrelated="$config/opencode-governance-tools/unrelated-user-tool.txt"
          ./scripts/install.sh --config-dir "$config" --routing-config "$GITHUB_WORKSPACE/tests/fixtures/routing/architect-failover.valid.json"
          mkdir -p "$(dirname "$unrelated")";printf 'preserve\n' > "$unrelated"
          cmp scripts/run-governed.ps1 "$config/opencode-governance-tools/architect-attempt.ps1"
          cmp scripts/run-governed.sh "$config/opencode-governance-tools/architect-attempt.sh"
          python3 - "$config" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);data=json.loads((root/'opencode-governance-routing.json').read_text());tools=root/'opencode-governance-tools'
          for field in ['governance_version','architect_runner_version','context_intelligence_version','workflow_continuation_version']: assert data[field]=='3.6.0'
          names=['architect-attempt.ps1','architect-attempt.sh','executor-attempt.ps1','executor-attempt.sh','context-intelligence.ps1','context-intelligence.sh','context-intelligence.py','workflow-continuation.ps1','workflow-continuation.py','governance-authority.py','governance-memory.py','governance-evidence.py','governance-simulation.py','governance-pre-commit.py']
          assert data['managed_tools']==[str(tools/name) for name in names]
          for name in ['architect','build','plan']:
              text=(root/'agents'/f'{name}.md').read_text()
              for marker in ['ARCHITECT_RUNNER_INTEGRATION','ARCHITECT_RUNNER_REQUIRED','POWERSHELL_7_REQUIRED','PROJECT_STATE_FINGERPRINT_V1','NON_GIT_PROJECT_SUPPORTED','PROJECT_STATE_CHANGED','[[OPENCODE_GOVERNANCE_ARCHITECT_RUNNER_ACTIVE=1]]','GOVERNANCE_AUTHORITY_V1']:assert marker in text
          for command in ['ai-init','ai-audit','ai-discover','ai-plan']:
              text=(root/'commands'/f'{command}.md').read_text()
              for marker in ['ARCHITECT_RUNNER_ENTRY_GATE','ARCHITECT_RUNNER_REQUIRED','PROJECT_STATE_CHANGED','pwsh -NoProfile -File','WINDOWS_COMMAND:','UNIX_COMMAND:']:assert marker in text
          for command in ['ai-workflow','ai-resume']:
              text=(root/'commands'/f'{command}.md').read_text()
              for marker in ['WORKFLOW_CONTINUATION_GATE_V1','WINDOWS_WORKFLOW_CONTINUATION_CORE','UNIX_WORKFLOW_CONTINUATION_CORE','CONTINUE_REQUIRED','TERMINAL_ALLOWED',str(tools/'workflow-continuation.ps1'),str(tools/'workflow-continuation.py')]:assert marker in text
          PY
          ./scripts/verify-routing.sh "$config"
          ./scripts/uninstall.sh --config-dir "$config" >/dev/null
          test -f "$unrelated"
          for name in architect-attempt.ps1 architect-attempt.sh executor-attempt.ps1 executor-attempt.sh context-intelligence.ps1 context-intelligence.sh context-intelligence.py workflow-continuation.ps1 workflow-continuation.py governance-authority.py governance-memory.py governance-evidence.py governance-simulation.py governance-pre-commit.py;do test ! -e "$config/opencode-governance-tools/$name";done
      - name: Exercise transactional and non-Git behavior
        shell: bash
        run: bash tests/test-project-state-integrity.sh

  windows-architect-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install and verify deterministic Architect runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$config=Join-Path $env:RUNNER_TEMP 'opencode-v332'
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/architect-failover.valid.json')
          $tools=Join-Path $config 'opencode-governance-tools';'preserve'|Set-Content (Join-Path $tools 'unrelated-user-tool.txt')
          if((Get-FileHash scripts/run-governed.ps1).Hash-ne(Get-FileHash (Join-Path $tools 'architect-attempt.ps1')).Hash){throw 'Installed PowerShell Architect runner is stale'}
          if((Get-FileHash scripts/run-governed.sh).Hash-ne(Get-FileHash (Join-Path $tools 'architect-attempt.sh')).Hash){throw 'Installed Unix Architect runner is stale'}
          $manifest=Get-Content (Join-Path $config 'opencode-governance-routing.json') -Raw|ConvertFrom-Json
          foreach($field in 'governance_version','architect_runner_version','context_intelligence_version','workflow_continuation_version'){if($manifest.$field-ne'3.6.0'){throw "$field is not 3.6.0"}}
          $names=@('architect-attempt.ps1','architect-attempt.sh','executor-attempt.ps1','executor-attempt.sh','context-intelligence.ps1','context-intelligence.sh','context-intelligence.py','workflow-continuation.ps1','workflow-continuation.py','governance-authority.py','governance-memory.py','governance-evidence.py','governance-simulation.py','governance-pre-commit.py')
          if(@($manifest.managed_tools).Count-ne14){throw 'Expected fourteen managed tools'}
          foreach($name in $names){if(-not(Test-Path (Join-Path $tools $name) -PathType Leaf)){throw "Missing managed tool: $name"}}
          foreach($name in 'architect','build','plan'){
            $text=Get-Content (Join-Path $config "agents/$name.md") -Raw
            foreach($marker in 'ARCHITECT_RUNNER_INTEGRATION','ARCHITECT_RUNNER_REQUIRED','POWERSHELL_7_REQUIRED','PROJECT_STATE_FINGERPRINT_V1','NON_GIT_PROJECT_SUPPORTED','PROJECT_STATE_CHANGED','[[OPENCODE_GOVERNANCE_ARCHITECT_RUNNER_ACTIVE=1]]','GOVERNANCE_AUTHORITY_V1'){if($text-notlike"*$marker*"){throw "$name missing marker: $marker"}}
          }
          foreach($command in 'ai-init','ai-audit','ai-discover','ai-plan'){
            $text=Get-Content (Join-Path $config "commands/$command.md") -Raw
            foreach($marker in 'ARCHITECT_RUNNER_ENTRY_GATE','ARCHITECT_RUNNER_REQUIRED','PROJECT_STATE_CHANGED','pwsh -NoProfile -File','WINDOWS_COMMAND:','UNIX_COMMAND:'){if($text-notlike"*$marker*"){throw "$command missing marker: $marker"}}
          }
          foreach($command in 'ai-workflow','ai-resume'){
            $text=Get-Content (Join-Path $config "commands/$command.md") -Raw
            foreach($marker in 'WORKFLOW_CONTINUATION_GATE_V1','WINDOWS_WORKFLOW_CONTINUATION_CORE','UNIX_WORKFLOW_CONTINUATION_CORE','CONTINUE_REQUIRED','TERMINAL_ALLOWED',(Join-Path $tools 'workflow-continuation.ps1'),(Join-Path $tools 'workflow-continuation.py')){if($text-notlike"*$marker*"){throw "$command missing marker: $marker"}}
          }
          ./scripts/verify-routing.ps1 -ConfigDir $config;./scripts/uninstall.ps1 -ConfigDir $config|Out-Null
          if(-not(Test-Path (Join-Path $tools 'unrelated-user-tool.txt'))){throw 'Unrelated user tool was removed'}
          foreach($name in $names){if(Test-Path (Join-Path $tools $name)){throw "Managed tool survived uninstall: $name"}}
      - name: Exercise transactional and non-Git behavior
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-project-state-integrity.ps1
