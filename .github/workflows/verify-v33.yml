name: Verify Executor failover v3.3
on:
  push:
  pull_request:

jobs:
  linux-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify whitelabel repository state
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi '(minimax|mimo|deepseek|qwen|glm-?5|gpt-?5\.6|alibaba-token|xiaomi/|zai/|openai/gpt)' -- . ':!CHANGELOG.md'; then
            echo 'Commercial provider or model identifier found in tracked v3.3 content.' >&2
            exit 1
          fi

      - name: Validate Unix scripts
        run: bash -n scripts/install.sh scripts/verify.sh scripts/verify-routing.sh scripts/run-governed.sh scripts/executor-attempt.sh scripts/uninstall.sh

      - name: Install and uninstall Executor routing
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/opencode-v33-install"
          mkdir -p "$config/agents" "$config/opencode-governance-tools"
          printf 'user\n' > "$config/agents/unrelated-user-agent.md"
          printf 'user\n' > "$config/opencode-governance-tools/unrelated-user-tool"
          ./scripts/install.sh --config-dir "$config" --routing-config "$GITHUB_WORKSPACE/tests/fixtures/routing/executor-failover.valid.json"
          ./scripts/verify.sh "$config"
          bash ./scripts/verify-routing.sh "$config"
          test "$(find "$config/agents" -maxdepth 1 -type f -name '*.md' ! -name 'unrelated-user-agent.md' | wc -l)" -eq 13
          test "$(find "$config/agents" -maxdepth 1 -type f -name 'executor-fallback-*.md' | wc -l)" -eq 3
          test -x "$config/opencode-governance-tools/executor-attempt.sh"
          test -f "$config/opencode-governance-tools/executor-attempt.ps1"
          ./scripts/uninstall.sh --config-dir "$config" >/dev/null
          test -f "$config/agents/unrelated-user-agent.md"
          test -f "$config/opencode-governance-tools/unrelated-user-tool"
          test ! -e "$config/opencode-governance-routing.json"
          test ! -e "$config/opencode-governance-tools/executor-attempt.sh"
          test ! -e "$config/opencode-governance-tools/executor-attempt.ps1"

      - name: Verify route selection by work class
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/opencode-v33-select"
          ./scripts/install.sh --config-dir "$config" --routing-config "$GITHUB_WORKSPACE/tests/fixtures/routing/executor-failover.valid.json" >/dev/null
          helper="$config/opencode-governance-tools/executor-attempt.sh"
          first="$(bash "$helper" select --config-dir "$config" --work-class PATCH)"
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["route_agent"])' <<<"$first")" = executor
          same="$(bash "$helper" select --config-dir "$config" --work-class PATCH --failure-class RATE_LIMIT --failed-route executor --attempted-route executor)"
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["route_agent"])' <<<"$same")" = executor-fallback-1
          bounded="$(bash "$helper" select --config-dir "$config" --work-class PATCH --failure-class MODEL_RETIRED --failed-route executor --attempted-route executor --attempted-route executor-fallback-1)"
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["route_agent"])' <<<"$bounded")" = executor-fallback-2
          major="$(bash "$helper" select --config-dir "$config" --work-class HIGH_RISK_CHANGE --failure-class MODEL_RETIRED --failed-route executor --attempted-route executor --attempted-route executor-fallback-1)"
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["route_agent"])' <<<"$major")" = executor-fallback-3

      - name: Verify isolated discard binary promotion and dirty preservation
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/executor-project"
          config="$RUNNER_TEMP/executor-config"
          mkdir -p "$project"
          ./scripts/install.sh --config-dir "$config" --routing-config "$GITHUB_WORKSPACE/tests/fixtures/routing/executor-failover.valid.json" >/dev/null
          helper="$config/opencode-governance-tools/executor-attempt.sh"
          git -C "$project" init -q
          git -C "$project" config user.email test@example.com
          git -C "$project" config user.name Test
          printf 'base\n' > "$project/app.txt"
          printf 'tracked\n' > "$project/unrelated.txt"
          python3 - "$project/image.bin" <<'PY'
          import pathlib,sys
          pathlib.Path(sys.argv[1]).write_bytes(b'\x00\x01base\xff')
          PY
          git -C "$project" add .
          git -C "$project" commit -qm base
          frozen="$(git -C "$project" rev-parse HEAD)"
          printf 'user-dirty\n' >> "$project/unrelated.txt"
          packet="$(printf packet | sha256sum | awk '{print $1}')"

          prep1="$(bash "$helper" prepare --project-dir "$project" --config-dir "$config" --task-id TASK-1 --attempt-id attempt-1 --frozen-target "$frozen" --work-class PATCH --route-agent executor --packet-sha256 "$packet")"
          root1="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep1")"
          printf 'partial\n' > "$root1/app.txt"
          printf 'partial\n' > "$root1/partial.txt"
          bash "$helper" discard --project-dir "$project" --config-dir "$config" --task-id TASK-1 --attempt-id attempt-1 --failure-class RATE_LIMIT >/dev/null
          test "$(cat "$project/app.txt")" = base
          test ! -e "$project/partial.txt"
          test "$(tail -n 1 "$project/unrelated.txt")" = user-dirty

          selected="$(bash "$helper" select --config-dir "$config" --work-class PATCH --failure-class RATE_LIMIT --failed-route executor --attempted-route executor)"
          test "$(python3 -c 'import json,sys;print(json.load(sys.stdin)["route_agent"])' <<<"$selected")" = executor-fallback-1
          prep2="$(bash "$helper" prepare --project-dir "$project" --config-dir "$config" --task-id TASK-1 --attempt-id attempt-2 --frozen-target "$frozen" --work-class PATCH --route-agent executor-fallback-1 --packet-sha256 "$packet")"
          root2="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep2")"
          printf 'implemented\n' > "$root2/app.txt"
          printf 'new\n' > "$root2/new.txt"
          python3 - "$root2/image.bin" <<'PY'
          import pathlib,sys
          pathlib.Path(sys.argv[1]).write_bytes(b'\x00\x02implemented\xfe')
          PY
          report="$project/.ai/tasks/TASK-1/evidence/executor-attempts/report-2.json"
          mkdir -p "$(dirname "$report")"
          python3 - "$report" "$packet" "$frozen" <<'PY'
          import json,sys
          json.dump({'EXECUTOR_ATTEMPT_ID':'attempt-2','PACKET_SHA256':sys.argv[2],'FROZEN_TARGET_SHA':sys.argv[3],'REPORT_COMPLETE':'YES'},open(sys.argv[1],'w'))
          PY
          bash "$helper" finalize --project-dir "$project" --config-dir "$config" --task-id TASK-1 --attempt-id attempt-2 --report-path "$report" >/dev/null
          bash "$helper" promote --project-dir "$project" --config-dir "$config" --task-id TASK-1 --attempt-id attempt-2 >/dev/null
          test "$(cat "$project/app.txt")" = implemented
          test "$(cat "$project/new.txt")" = new
          test "$(tail -n 1 "$project/unrelated.txt")" = user-dirty
          python3 - "$project/image.bin" <<'PY'
          import pathlib,sys
          assert pathlib.Path(sys.argv[1]).read_bytes()==b'\x00\x02implemented\xfe'
          PY
          test ! -d "$root2"

      - name: Verify report path and real-state blockers
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/executor-block-config"
          ./scripts/install.sh --config-dir "$config" --routing-config "$GITHUB_WORKSPACE/tests/fixtures/routing/executor-failover.valid.json" >/dev/null
          helper="$config/opencode-governance-tools/executor-attempt.sh"

          make_repo() {
            local project="$1"
            mkdir -p "$project"
            git -C "$project" init -q
            git -C "$project" config user.email test@example.com
            git -C "$project" config user.name Test
            printf 'base\n' > "$project/app.txt"
            printf 'tracked\n' > "$project/unrelated.txt"
            git -C "$project" add .
            git -C "$project" commit -qm base
          }
          packet="$(printf packet | sha256sum | awk '{print $1}')"

          forbidden="$RUNNER_TEMP/forbidden-project"
          make_repo "$forbidden"
          frozen="$(git -C "$forbidden" rev-parse HEAD)"
          prep="$(bash "$helper" prepare --project-dir "$forbidden" --config-dir "$config" --task-id TASK-F --attempt-id forbidden --frozen-target "$frozen" --work-class PATCH --route-agent executor --packet-sha256 "$packet")"
          root="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep")"
          mkdir -p "$root/.ai"; printf 'forbidden\n' > "$root/.ai/state.txt"; printf 'change\n' > "$root/app.txt"
          report="$forbidden/.ai/tasks/TASK-F/evidence/executor-attempts/report.json"; mkdir -p "$(dirname "$report")"
          python3 - "$report" "$packet" "$frozen" <<'PY'
          import json,sys
          json.dump({'EXECUTOR_ATTEMPT_ID':'forbidden','PACKET_SHA256':sys.argv[2],'FROZEN_TARGET_SHA':sys.argv[3],'REPORT_COMPLETE':'YES'},open(sys.argv[1],'w'))
          PY
          if bash "$helper" finalize --project-dir "$forbidden" --config-dir "$config" --task-id TASK-F --attempt-id forbidden --report-path "$report"; then exit 1; fi
          bash "$helper" discard --project-dir "$forbidden" --config-dir "$config" --task-id TASK-F --attempt-id forbidden >/dev/null

          incomplete="$RUNNER_TEMP/incomplete-project"
          make_repo "$incomplete"
          frozen="$(git -C "$incomplete" rev-parse HEAD)"
          prep="$(bash "$helper" prepare --project-dir "$incomplete" --config-dir "$config" --task-id TASK-I --attempt-id incomplete --frozen-target "$frozen" --work-class PATCH --route-agent executor --packet-sha256 "$packet")"
          root="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep")"; printf 'change\n' > "$root/app.txt"
          report="$incomplete/.ai/tasks/TASK-I/evidence/executor-attempts/report.json"; mkdir -p "$(dirname "$report")"
          printf '{"EXECUTOR_ATTEMPT_ID":"incomplete","PACKET_SHA256":"%s","FROZEN_TARGET_SHA":"%s","REPORT_COMPLETE":"NO"}\n' "$packet" "$frozen" > "$report"
          if bash "$helper" finalize --project-dir "$incomplete" --config-dir "$config" --task-id TASK-I --attempt-id incomplete --report-path "$report"; then exit 1; fi
          bash "$helper" discard --project-dir "$incomplete" --config-dir "$config" --task-id TASK-I --attempt-id incomplete >/dev/null

          overlap="$RUNNER_TEMP/overlap-project"
          make_repo "$overlap"
          frozen="$(git -C "$overlap" rev-parse HEAD)"; printf 'dirty\n' >> "$overlap/app.txt"
          prep="$(bash "$helper" prepare --project-dir "$overlap" --config-dir "$config" --task-id TASK-O --attempt-id overlap --frozen-target "$frozen" --work-class PATCH --route-agent executor --packet-sha256 "$packet")"
          root="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep")"; printf 'executor\n' > "$root/app.txt"
          report="$overlap/.ai/tasks/TASK-O/evidence/executor-attempts/report.json"; mkdir -p "$(dirname "$report")"
          python3 - "$report" "$packet" "$frozen" <<'PY'
          import json,sys
          json.dump({'EXECUTOR_ATTEMPT_ID':'overlap','PACKET_SHA256':sys.argv[2],'FROZEN_TARGET_SHA':sys.argv[3],'REPORT_COMPLETE':'YES'},open(sys.argv[1],'w'))
          PY
          bash "$helper" finalize --project-dir "$overlap" --config-dir "$config" --task-id TASK-O --attempt-id overlap --report-path "$report" >/dev/null
          if bash "$helper" promote --project-dir "$overlap" --config-dir "$config" --task-id TASK-O --attempt-id overlap; then exit 1; fi
          grep -q dirty "$overlap/app.txt"
          bash "$helper" discard --project-dir "$overlap" --config-dir "$config" --task-id TASK-O --attempt-id overlap >/dev/null

          drift="$RUNNER_TEMP/drift-project"
          make_repo "$drift"
          frozen="$(git -C "$drift" rev-parse HEAD)"; printf 'dirty-one\n' >> "$drift/unrelated.txt"
          prep="$(bash "$helper" prepare --project-dir "$drift" --config-dir "$config" --task-id TASK-D --attempt-id drift --frozen-target "$frozen" --work-class PATCH --route-agent executor --packet-sha256 "$packet")"
          root="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["execution_root"])' <<<"$prep")"; printf 'executor\n' > "$root/app.txt"
          report="$drift/.ai/tasks/TASK-D/evidence/executor-attempts/report.json"; mkdir -p "$(dirname "$report")"
          python3 - "$report" "$packet" "$frozen" <<'PY'
          import json,sys
          json.dump({'EXECUTOR_ATTEMPT_ID':'drift','PACKET_SHA256':sys.argv[2],'FROZEN_TARGET_SHA':sys.argv[3],'REPORT_COMPLETE':'YES'},open(sys.argv[1],'w'))
          PY
          bash "$helper" finalize --project-dir "$drift" --config-dir "$config" --task-id TASK-D --attempt-id drift --report-path "$report" >/dev/null
          printf 'dirty-two\n' >> "$drift/unrelated.txt"
          if bash "$helper" promote --project-dir "$drift" --config-dir "$config" --task-id TASK-D --attempt-id drift; then exit 1; fi
          test "$(cat "$drift/app.txt")" = base
          bash "$helper" discard --project-dir "$drift" --config-dir "$config" --task-id TASK-D --attempt-id drift >/dev/null

  windows-executor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in 'scripts/install.ps1','scripts/verify.ps1','scripts/verify-routing.ps1','scripts/run-governed.ps1','scripts/executor-attempt.ps1','scripts/uninstall.ps1'){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw "$path parse failed: $($errors -join '; ')"}
          }

      - name: Install and uninstall Executor routing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode-v33-install'
          New-Item -ItemType Directory -Force -Path "$config/agents","$config/opencode-governance-tools"|Out-Null
          'user'|Set-Content "$config/agents/unrelated-user-agent.md"
          'user'|Set-Content "$config/opencode-governance-tools/unrelated-user-tool"
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/executor-failover.valid.json')
          ./scripts/verify.ps1 -ConfigDir $config
          ./scripts/verify-routing.ps1 -ConfigDir $config
          if((Get-ChildItem "$config/agents" -Filter '*.md'|Where-Object Name -ne 'unrelated-user-agent.md').Count-ne13){throw 'Expected 13 managed agents'}
          if((Get-ChildItem "$config/agents" -Filter 'executor-fallback-*.md').Count-ne3){throw 'Expected 3 Executor aliases'}
          if(-not(Test-Path "$config/opencode-governance-tools/executor-attempt.ps1")){throw 'Missing installed PowerShell helper'}
          if(-not(Test-Path "$config/opencode-governance-tools/executor-attempt.sh")){throw 'Missing installed Unix helper'}
          ./scripts/uninstall.ps1 -ConfigDir $config
          if(-not(Test-Path "$config/agents/unrelated-user-agent.md")){throw 'Unrelated agent removed'}
          if(-not(Test-Path "$config/opencode-governance-tools/unrelated-user-tool")){throw 'Unrelated tool removed'}
          if(Test-Path "$config/opencode-governance-routing.json"){throw 'Manifest not removed'}
          if(Test-Path "$config/opencode-governance-tools/executor-attempt.ps1"){throw 'PowerShell helper not removed'}
          if(Test-Path "$config/opencode-governance-tools/executor-attempt.sh"){throw 'Unix helper not removed'}

      - name: Verify route selection by work class
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode-v33-select'
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/executor-failover.valid.json')|Out-Null
          $helper=Join-Path $config 'opencode-governance-tools/executor-attempt.ps1'
          $first=& $helper -Operation select -ConfigDir $config -WorkClass PATCH|ConvertFrom-Json
          if($first.route_agent-ne'executor'){throw 'Primary route not selected'}
          $same=& $helper -Operation select -ConfigDir $config -WorkClass PATCH -FailureClass RATE_LIMIT -FailedRoute executor -AttemptedRoute executor|ConvertFrom-Json
          if($same.route_agent-ne'executor-fallback-1'){throw 'Same-family route not selected'}
          $bounded=& $helper -Operation select -ConfigDir $config -WorkClass PATCH -FailureClass MODEL_RETIRED -FailedRoute executor -AttemptedRoute executor,executor-fallback-1|ConvertFrom-Json
          if($bounded.route_agent-ne'executor-fallback-2'){throw 'Bounded route not selected'}
          $major=& $helper -Operation select -ConfigDir $config -WorkClass HIGH_RISK_CHANGE -FailureClass MODEL_RETIRED -FailedRoute executor -AttemptedRoute executor,executor-fallback-1|ConvertFrom-Json
          if($major.route_agent-ne'executor-fallback-3'){throw 'Major route not selected'}

      - name: Verify isolated discard binary promotion and blockers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Hash-Text([string]$Text){$sha=[Security.Cryptography.SHA256]::Create();try{return([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($Text)))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}}
          function New-TestRepo([string]$Path){New-Item -ItemType Directory -Force -Path $Path|Out-Null;git -C $Path init -q;git -C $Path config user.email test@example.com;git -C $Path config user.name Test;'base'|Set-Content "$Path/app.txt";'tracked'|Set-Content "$Path/unrelated.txt";git -C $Path add .;git -C $Path commit -qm base}
          $config=Join-Path $env:RUNNER_TEMP 'executor-config'
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/executor-failover.valid.json')|Out-Null
          $helper=Join-Path $config 'opencode-governance-tools/executor-attempt.ps1'
          $packet=Hash-Text 'packet'

          $project=Join-Path $env:RUNNER_TEMP 'executor-project';New-TestRepo $project
          [IO.File]::WriteAllBytes("$project/image.bin",[byte[]](0,1,2,255));git -C $project add image.bin;git -C $project commit -qm binary
          $frozen=(git -C $project rev-parse HEAD).Trim();Add-Content "$project/unrelated.txt" 'user-dirty'
          $prep1=& $helper -Operation prepare -ProjectDir $project -ConfigDir $config -TaskId TASK-1 -AttemptId attempt-1 -FrozenTarget $frozen -WorkClass PATCH -RouteAgent executor -PacketSha256 $packet|ConvertFrom-Json
          'partial'|Set-Content (Join-Path $prep1.execution_root 'app.txt');'partial'|Set-Content (Join-Path $prep1.execution_root 'partial.txt')
          & $helper -Operation discard -ProjectDir $project -ConfigDir $config -TaskId TASK-1 -AttemptId attempt-1 -FailureClass RATE_LIMIT|Out-Null
          if((Get-Content "$project/app.txt")-ne'base'){throw 'Real worktree changed'}
          if(Test-Path "$project/partial.txt"){throw 'Partial file leaked'}
          $selected=& $helper -Operation select -ConfigDir $config -WorkClass PATCH -FailureClass RATE_LIMIT -FailedRoute executor -AttemptedRoute executor|ConvertFrom-Json
          if($selected.route_agent-ne'executor-fallback-1'){throw 'Same-family fallback not selected'}
          $prep2=& $helper -Operation prepare -ProjectDir $project -ConfigDir $config -TaskId TASK-1 -AttemptId attempt-2 -FrozenTarget $frozen -WorkClass PATCH -RouteAgent executor-fallback-1 -PacketSha256 $packet|ConvertFrom-Json
          'implemented'|Set-Content (Join-Path $prep2.execution_root 'app.txt');'new'|Set-Content (Join-Path $prep2.execution_root 'new.txt');[IO.File]::WriteAllBytes((Join-Path $prep2.execution_root 'image.bin'),[byte[]](0,9,8,254))
          $report="$project/.ai/tasks/TASK-1/evidence/executor-attempts/report-2.json";New-Item -ItemType Directory -Force -Path (Split-Path $report)|Out-Null
          @{EXECUTOR_ATTEMPT_ID='attempt-2';PACKET_SHA256=$packet;FROZEN_TARGET_SHA=$frozen;REPORT_COMPLETE='YES'}|ConvertTo-Json|Set-Content $report
          & $helper -Operation finalize -ProjectDir $project -ConfigDir $config -TaskId TASK-1 -AttemptId attempt-2 -ReportPath $report|Out-Null
          & $helper -Operation promote -ProjectDir $project -ConfigDir $config -TaskId TASK-1 -AttemptId attempt-2|Out-Null
          if((Get-Content "$project/app.txt")-ne'implemented'){throw 'Patch not promoted'}
          if((Get-Content "$project/new.txt")-ne'new'){throw 'New file not promoted'}
          if(-not([Linq.Enumerable]::SequenceEqual([byte[]][IO.File]::ReadAllBytes("$project/image.bin"),[byte[]](0,9,8,254)))){throw 'Binary patch corrupted'}
          if((Get-Content "$project/unrelated.txt")[-1]-ne'user-dirty'){throw 'Unrelated dirty change lost'}

          $overlap=Join-Path $env:RUNNER_TEMP 'overlap-project';New-TestRepo $overlap
          $frozen=(git -C $overlap rev-parse HEAD).Trim();Add-Content "$overlap/app.txt" 'dirty'
          $prep=& $helper -Operation prepare -ProjectDir $overlap -ConfigDir $config -TaskId TASK-O -AttemptId overlap -FrozenTarget $frozen -WorkClass PATCH -RouteAgent executor -PacketSha256 $packet|ConvertFrom-Json
          'executor'|Set-Content (Join-Path $prep.execution_root 'app.txt')
          $report="$overlap/.ai/tasks/TASK-O/evidence/executor-attempts/report.json";New-Item -ItemType Directory -Force -Path (Split-Path $report)|Out-Null
          @{EXECUTOR_ATTEMPT_ID='overlap';PACKET_SHA256=$packet;FROZEN_TARGET_SHA=$frozen;REPORT_COMPLETE='YES'}|ConvertTo-Json|Set-Content $report
          & $helper -Operation finalize -ProjectDir $overlap -ConfigDir $config -TaskId TASK-O -AttemptId overlap -ReportPath $report|Out-Null
          $failed=$false;try{& $helper -Operation promote -ProjectDir $overlap -ConfigDir $config -TaskId TASK-O -AttemptId overlap|Out-Null}catch{$failed=$true}
          if(-not$failed){throw 'Overlap unexpectedly promoted'}
          & $helper -Operation discard -ProjectDir $overlap -ConfigDir $config -TaskId TASK-O -AttemptId overlap|Out-Null

          $drift=Join-Path $env:RUNNER_TEMP 'drift-project';New-TestRepo $drift
          $frozen=(git -C $drift rev-parse HEAD).Trim();Add-Content "$drift/unrelated.txt" 'dirty-one'
          $prep=& $helper -Operation prepare -ProjectDir $drift -ConfigDir $config -TaskId TASK-D -AttemptId drift -FrozenTarget $frozen -WorkClass PATCH -RouteAgent executor -PacketSha256 $packet|ConvertFrom-Json
          'executor'|Set-Content (Join-Path $prep.execution_root 'app.txt')
          $report="$drift/.ai/tasks/TASK-D/evidence/executor-attempts/report.json";New-Item -ItemType Directory -Force -Path (Split-Path $report)|Out-Null
          @{EXECUTOR_ATTEMPT_ID='drift';PACKET_SHA256=$packet;FROZEN_TARGET_SHA=$frozen;REPORT_COMPLETE='YES'}|ConvertTo-Json|Set-Content $report
          & $helper -Operation finalize -ProjectDir $drift -ConfigDir $config -TaskId TASK-D -AttemptId drift -ReportPath $report|Out-Null
          Add-Content "$drift/unrelated.txt" 'dirty-two'
          $failed=$false;try{& $helper -Operation promote -ProjectDir $drift -ConfigDir $config -TaskId TASK-D -AttemptId drift|Out-Null}catch{$failed=$true}
          if(-not$failed){throw 'Same-status content drift unexpectedly promoted'}
          if((Get-Content "$drift/app.txt")-ne'base'){throw 'Blocked patch leaked into real worktree'}
          & $helper -Operation discard -ProjectDir $drift -ConfigDir $config -TaskId TASK-D -AttemptId drift|Out-Null
