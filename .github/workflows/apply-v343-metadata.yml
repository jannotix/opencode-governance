name: Apply v3.4.3 release metadata

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-v343-metadata
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'release/v3.4.3-integrity-jsonc' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          current = version.read_text(encoding='utf-8').strip()
          if current == '3.4.3':
              raise SystemExit(0)
          if current != '3.4.2':
              raise SystemExit(f'Expected VERSION 3.4.2 before migration, found {current!r}.')
          version.write_text('3.4.3\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = """Current release: **3.4.2 — Cross-Platform Schema Parity**.

Version 3.4.2 makes routing-profile and skill-manifest JSON type validation identical across Windows and Unix entrypoints; scalar strings no longer pass where the schema requires arrays or integers."""
          new = """Current release: **3.4.3 — Release Integrity & JSONC Readability**.

Version 3.4.3 preserves readable URL literals during Windows and Unix JSONC normalization, cleans the routing compatibility matrix and adds fail-closed release publication checks without changing local model routing."""
          if text.count(old) != 1:
              raise SystemExit('README release marker was not found exactly once.')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = "All released versions are recorded in this single file. Dates use `YYYY-MM-DD`.\n\n"
          entry = """## 3.4.3 - 2026-07-30

- Preserved literal `/` characters in normalized OpenCode JSONC so schema and provider URLs remain readable while comment markers inside strings stay safe.
- Added Windows and Unix regressions for readable URL serialization in addition to semantic JSONC preservation.
- Cleaned duplicated 3.4.2 entries from routing verification and uninstall compatibility matrices and added explicit 3.4.3 support.
- Added fail-closed release publication checks that verify release metadata and repair the incorrectly moved 3.4.1 tag only after confirming its historical commit.
- Preserved every local provider/model route, variant, fallback priority, work class, reviewer-independence rule, authentication and no-push/no-deploy governance contract.

"""
          if text.count(marker) != 1:
              raise SystemExit('CHANGELOG insertion marker was not found exactly once.')
          changelog.write_text(text.replace(marker, marker + entry), encoding='utf-8')

          for name in ('scripts/install.ps1', 'scripts/install.sh'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if '3.4.2' not in text:
                  raise SystemExit(f'{name}: current release marker not found.')
              text = text.replace('3.4.2', '3.4.3')
              text = text.replace('Cleanup & Hardening', 'Release Integrity & JSONC Readability')
              path.write_text(text, encoding='utf-8')

          path = Path('docs/architect-runner-integration.md')
          text = path.read_text(encoding='utf-8')
          sentence = 'Version 3.4.2 enforces identical JSON array and integer types across Windows and Unix entrypoints.'
          replacement = sentence + ' Version 3.4.3 preserves readable JSONC URL literals and publishes releases through verified repository metadata.'
          if text.count(sentence) != 1:
              raise SystemExit('Architect runner release sentence was not found exactly once.')
          text = text.replace(sentence, replacement)
          text = text.replace('The 3.4.2 routing manifest records:', 'The 3.4.3 routing manifest records:')
          text = text.replace('governance_version: 3.4.2\narchitect_runner_version: 3.4.2\ncontext_intelligence_version: 3.4.2', 'governance_version: 3.4.3\narchitect_runner_version: 3.4.3\ncontext_intelligence_version: 3.4.3')
          text = text.replace('A 3.4.2 installation preserves', 'A 3.4.3 installation preserves')
          path.write_text(text, encoding='utf-8')

          path = Path('docs/context-intelligence-skill-routing.md')
          text = path.read_text(encoding='utf-8')
          sentence = 'Version 3.4.2 rejects string-encoded token estimates and aligns the PowerShell schema with the Python core.'
          replacement = sentence + ' Version 3.4.3 keeps normalized URL literals human-readable on both platforms.'
          if text.count(sentence) != 1:
              raise SystemExit('Context Intelligence release sentence was not found exactly once.')
          text = text.replace(sentence, replacement)
          text = text.replace('governance_version: 3.4.2\narchitect_runner_version: 3.4.2\ncontext_intelligence_version: 3.4.2', 'governance_version: 3.4.3\narchitect_runner_version: 3.4.3\ncontext_intelligence_version: 3.4.3')
          text = text.replace('A 3.4.2 installation preserves', 'A 3.4.3 installation preserves')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused release regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/normalize-jsonc.py tests/test-jsonc-readable.py tests/test-jsonc-preservation.py
          python3 tests/test-jsonc-readable.py
          python3 tests/test-jsonc-preservation.py
          python3 tests/test-hardening.py
          pwsh -NoProfile -File tests/test-jsonc-readable.ps1
          pwsh -NoProfile -File tests/test-jsonc-preservation.ps1

      - name: Commit validated metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md scripts/install.ps1 scripts/install.sh docs/architect-runner-integration.md docs/context-intelligence-skill-routing.md
          git diff --cached --check
          git commit -m 'release: prepare OpenCode Governance 3.4.3'
          git push origin HEAD:release/v3.4.3-integrity-jsonc
