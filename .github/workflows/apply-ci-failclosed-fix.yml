name: Apply CI fail-closed fix
on:
  push:
    branches: [fix/ci-fail-closed-resume-validation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-fail-closed-resume-validation
          fetch-depth: 0
      - name: Apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/governance-capabilities.py')
          text = path.read_text(encoding='utf-8')
          old = '''    expected = base_tools(config) if version == BASE_VERSION else expected_tools(config)
    if manifest.get("managed_tools") != [str(path) for path in expected]:
        fail("UNSAFE_MANAGED_TOOL_SET", str(version))
'''
          new = '''    expected = base_tools(config) if version == BASE_VERSION else expected_tools(config)
    managed = manifest.get("managed_tools")
    if not isinstance(managed, list) or any(not isinstance(value, str) for value in managed):
        fail("UNSAFE_MANAGED_TOOL_SET", str(version))

    def normalized_tool_path(value: str | pathlib.Path) -> str:
        normalized = str(pathlib.Path(value).resolve(strict=False))
        return os.path.normcase(normalized) if os.name == "nt" else normalized

    if [normalized_tool_path(value) for value in managed] != [
        normalized_tool_path(value) for value in expected
    ]:
        fail("UNSAFE_MANAGED_TOOL_SET", str(version))
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'def normalized_tool_path' not in text:
              raise SystemExit('managed-tool comparison block not found')
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/verify-hardening.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''        run: |
          $errors=$null
''',
              '''        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $errors=$null
''',
              1,
          )
          text = text.replace(
              '''        run: |
          pwsh -NoProfile -File tests/test-runner-contract.ps1
''',
              '''        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File tests/test-runner-contract.ps1
''',
              1,
          )
          text = text.replace(
              '          python tests/test-governance-capabilities.py\n',
              '          python tests/test-governance-capabilities.py\n          python tests/test-capability-path-normalization.py\n',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/verify.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "$ErrorActionPreference='Stop'",
              "$ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$true",
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/governance-capabilities.py tests/test-capability-path-normalization.py
          grep -q 'PSNativeCommandUseErrorActionPreference' .github/workflows/verify-hardening.yml
          grep -q 'PSNativeCommandUseErrorActionPreference' .github/workflows/verify.yml
          grep -q 'normalized_tool_path' scripts/governance-capabilities.py
          rm .github/workflows/apply-ci-failclosed-fix.yml
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Windows validation fail closed'
          git push origin HEAD:fix/ci-fail-closed-resume-validation
