name: Verify repository hardening
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-v344:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/release/v3.4.4-deterministic-workflow-continuation') || (github.event_name == 'pull_request' && github.head_ref == 'release/v3.4.4-deterministic-workflow-continuation')) && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.4.4-deterministic-workflow-continuation
          fetch-depth: 0
      - name: Apply deterministic continuation release
        run: python3 scripts/apply-v344.py
      - name: Run focused regressions before commit
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/workflow-continuation.py tests/test-workflow-continuation.py tests/test-command-contracts.py
          python3 tests/test-workflow-continuation.py
          bash tests/test-workflow-continuation.sh
          python3 tests/test-command-contracts.py
          bash -n scripts/install.sh scripts/uninstall.sh scripts/verify-routing.sh
          git diff --check
      - name: Commit validated migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare OpenCode Governance 3.4.4'
          git push origin HEAD:release/v3.4.4-deterministic-workflow-continuation

  linux-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Validate hardening tests and scripts
        run: |
          python3 -m py_compile tests/test-hardening.py tests/test-jsonc-preservation.py tests/test-jsonc-readable.py tests/test-workflow-continuation.py tests/test-command-contracts.py scripts/context-intelligence.py scripts/normalize-jsonc.py scripts/workflow-continuation.py
          bash -n scripts/install.sh scripts/install-core.sh scripts/run-governed.sh tests/test-workflow-continuation.sh
      - name: Run hardening regressions
        run: |
          python3 tests/test-hardening.py
          python3 tests/test-jsonc-preservation.py
          python3 tests/test-jsonc-readable.py
          python3 tests/test-workflow-continuation.py
          bash tests/test-workflow-continuation.sh
          python3 tests/test-command-contracts.py

  windows-hardening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors=$null
          foreach($path in 'tests/test-runner-contract.ps1','tests/test-jsonc-preservation.ps1','tests/test-jsonc-readable.ps1','tests/test-workflow-continuation.ps1','scripts/run-governed.ps1','scripts/install.ps1','scripts/normalize-jsonc.ps1'){
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)|Out-Null
            if($errors.Count){throw "$path`n$($errors|Out-String)"}
          }
      - name: Run Windows hardening regressions
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test-runner-contract.ps1
          pwsh -NoProfile -File tests/test-jsonc-preservation.ps1
          pwsh -NoProfile -File tests/test-jsonc-readable.ps1
          pwsh -NoProfile -File tests/test-workflow-continuation.ps1
          python tests/test-command-contracts.py
