name: Verify repository hardening
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  linux-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Validate hardening tests and scripts
        run: |
          python3 -m py_compile tests/test-hardening.py tests/test-jsonc-preservation.py tests/test-jsonc-readable.py scripts/context-intelligence.py scripts/normalize-jsonc.py
          bash -n scripts/install.sh scripts/install-core.sh scripts/run-governed.sh
      - name: Run hardening regressions
        run: |
          python3 tests/test-hardening.py
          python3 tests/test-jsonc-preservation.py
          python3 tests/test-jsonc-readable.py

  windows-hardening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors=$null
          foreach($path in 'tests/test-runner-contract.ps1','tests/test-jsonc-preservation.ps1','tests/test-jsonc-readable.ps1','scripts/run-governed.ps1','scripts/install.ps1','scripts/normalize-jsonc.ps1'){
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)|Out-Null
            if($errors.Count){throw "$path`n$($errors|Out-String)"}
          }
      - name: Run Windows hardening regressions
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test-runner-contract.ps1
          pwsh -NoProfile -File tests/test-jsonc-preservation.ps1
          pwsh -NoProfile -File tests/test-jsonc-readable.ps1

  apply-v343-metadata:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v3.4.3-integrity-jsonc' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply release metadata
        run: python3 scripts/apply-v343-metadata.py
      - name: Run focused release regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/normalize-jsonc.py tests/test-jsonc-readable.py tests/test-jsonc-preservation.py
          python3 tests/test-jsonc-readable.py
          python3 tests/test-jsonc-preservation.py
          python3 tests/test-hardening.py
          pwsh -NoProfile -File tests/test-jsonc-readable.ps1
          pwsh -NoProfile -File tests/test-jsonc-preservation.ps1
      - name: Commit validated metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md scripts/install.ps1 scripts/install.sh docs/architect-runner-integration.md docs/context-intelligence-skill-routing.md
          git diff --cached --check
          git commit -m 'release: prepare OpenCode Governance 3.4.3'
          git push origin HEAD:release/v3.4.3-integrity-jsonc
