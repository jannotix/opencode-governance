name: Verify repository hardening
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Validate hardening tests and scripts
        run: |
          python3 -m py_compile \
            tests/test-hardening.py \
            tests/test-unified-release.py \
            tests/test-jsonc-preservation.py \
            tests/test-jsonc-readable.py \
            tests/test-workflow-continuation.py \
            tests/test-command-contracts.py \
            tests/test-release-publisher.py \
            tests/test-governance-authority-memory.py \
            tests/test-governance-pre-commit.py \
            tests/test-governance-capabilities.py \
            tests/test-governance-simulation-fixture.py \
            tests/test-governance-simulation-run.py \
            tests/test-context-intelligence.py \
            tests/test-architect-headless-contract.py \
            tests/test-nested-governance-roots.py \
            tests/test-legacy-orphan-recovery.py \
            tests/test-semantic-transition-matrix.py \
            scripts/context-intelligence.py \
            scripts/legacy-architect-orphan-recovery.py \
            scripts/normalize-jsonc.py \
            scripts/workflow-continuation.py \
            scripts/governance-semantic.py \
            scripts/opencode-compatibility.py \
            scripts/governance-metrics.py \
            scripts/generate-governance-contract.py \
            scripts/architect-headless-contract.py \
            scripts/workspace-repository-root-contract.py \
            scripts/governance-authority.py \
            scripts/governance-memory.py \
            scripts/governance-evidence.py \
            scripts/governance-pre-commit.py \
            scripts/governance-simulation.py \
            scripts/governance-capabilities.py \
            scripts/governance-install-transaction.py \
            scripts/generated/governance_contract_data.py
          bash -n \
            scripts/install.sh \
            scripts/install-base.sh \
            scripts/install-core.sh \
            scripts/uninstall.sh \
            scripts/uninstall-base.sh \
            scripts/uninstall-core.sh \
            scripts/verify-routing.sh \
            scripts/run-governed.sh \
            scripts/executor-attempt.sh \
            tests/test-workflow-continuation.sh \
            tests/test-executor-transaction.sh \
            tests/test-project-state-integrity.sh \
            tests/test-ai-resume-transaction.sh \
            tests/test-ai-resume-postcondition.sh \
            tests/test-architect-headless-permissions.sh \
            tests/test-prompt-transport.sh \
            tests/test-nested-governance-roots.sh
      - name: Run hardening regressions
        run: |
          python3 tests/test-hardening.py
          python3 tests/test-unified-release.py
          python3 tests/test-jsonc-preservation.py
          python3 tests/test-jsonc-readable.py
          python3 tests/test-workflow-continuation.py
          python3 -m unittest tests.test-semantic-transition-matrix
          python3 scripts/generate-governance-contract.py --root . --check
          bash tests/test-workflow-continuation.sh
          bash tests/test-executor-transaction.sh
          bash tests/test-project-state-integrity.sh
          bash tests/test-ai-resume-transaction.sh
          bash tests/test-ai-resume-postcondition.sh
          bash tests/test-architect-headless-permissions.sh
          bash tests/test-prompt-transport.sh
          bash tests/test-nested-governance-roots.sh
          python3 tests/test-architect-headless-contract.py
          python3 tests/test-nested-governance-roots.py
          python3 tests/test-legacy-orphan-recovery.py
          python3 tests/test-context-intelligence.py
          python3 tests/test-command-contracts.py
          python3 tests/test-release-publisher.py
          python3 tests/test-governance-authority-memory.py
          python3 tests/test-governance-pre-commit.py
          python3 tests/test-governance-capabilities.py
          python3 tests/test-governance-simulation-fixture.py
          python3 tests/test-governance-simulation-run.py
          python3 tests/test-all-commands-simulation.py

  windows-hardening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Parse PowerShell and compile Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $errors=$null
          foreach($path in @('tests/test-runner-contract.ps1','tests/test-jsonc-preservation.ps1','tests/test-jsonc-readable.ps1','tests/test-workflow-continuation.ps1','tests/test-executor-transaction.ps1','tests/test-context-intelligence.ps1','tests/test-project-state-integrity.ps1','tests/test-ai-resume-transaction.ps1','tests/test-ai-resume-postcondition.ps1','tests/test-architect-headless-permissions.ps1','tests/test-prompt-transport.ps1','tests/test-nested-governance-roots.ps1','scripts/workflow-continuation.ps1','scripts/run-governed.ps1','scripts/executor-attempt.ps1','scripts/install.ps1','scripts/install-base.ps1','scripts/install-core.ps1','scripts/uninstall.ps1','scripts/uninstall-base.ps1','scripts/uninstall-core.ps1','scripts/verify-routing.ps1','scripts/normalize-jsonc.ps1')){
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)|Out-Null
            if($errors.Count){throw "$path`n$($errors|Out-String)"}
          }
          python -m py_compile tests/test-governance-authority-memory.py tests/test-governance-pre-commit.py tests/test-governance-capabilities.py tests/test-governance-simulation-fixture.py tests/test-governance-simulation-run.py tests/test-context-intelligence.py tests/test-architect-headless-contract.py tests/test-nested-governance-roots.py tests/test-legacy-orphan-recovery.py tests/test-semantic-transition-matrix.py scripts/architect-headless-contract.py scripts/workspace-repository-root-contract.py scripts/legacy-architect-orphan-recovery.py scripts/workflow-continuation.py scripts/governance-semantic.py scripts/opencode-compatibility.py scripts/governance-metrics.py scripts/generate-governance-contract.py scripts/generated/governance_contract_data.py scripts/governance-authority.py scripts/governance-memory.py scripts/governance-evidence.py scripts/governance-pre-commit.py scripts/governance-simulation.py scripts/governance-capabilities.py scripts/governance-install-transaction.py
      - name: Run Windows hardening regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File tests/test-runner-contract.ps1
          pwsh -NoProfile -File tests/test-jsonc-preservation.ps1
          pwsh -NoProfile -File tests/test-jsonc-readable.ps1
          pwsh -NoProfile -File tests/test-workflow-continuation.ps1
          pwsh -NoProfile -File tests/test-executor-transaction.ps1
          pwsh -NoProfile -File tests/test-context-intelligence.ps1
          pwsh -NoProfile -File tests/test-project-state-integrity.ps1
          pwsh -NoProfile -File tests/test-ai-resume-transaction.ps1
          pwsh -NoProfile -File tests/test-ai-resume-postcondition.ps1
          pwsh -NoProfile -File tests/test-nested-governance-roots.ps1
          pwsh -NoProfile -File tests/test-architect-headless-permissions.ps1
          pwsh -NoProfile -File tests/test-prompt-transport.ps1
          python tests/test-architect-headless-contract.py
          python tests/test-command-contracts.py
          python tests/test-release-publisher.py
          python tests/test-governance-authority-memory.py
          python tests/test-governance-pre-commit.py
          python tests/test-governance-capabilities.py
          python tests/test-governance-simulation-fixture.py
          python tests/test-governance-simulation-run.py
          python tests/test-workflow-continuation.py
          python -m unittest tests.test-semantic-transition-matrix
          python scripts/generate-governance-contract.py --root . --check
          python tests/test-all-commands-simulation.py
