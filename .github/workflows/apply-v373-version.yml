name: Apply v3.7.3 version alignment
on:
  push:
    branches: [fix/3.7.3-resume-postcondition]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.7.3-resume-postcondition
          fetch-depth: 0
      - name: Align release version and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def one(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {text.count(old)}')
              write(path, text.replace(old, new, 1))

          write('VERSION', '3.7.3\n')
          one('pyproject.toml', 'version = "3.7.2"', 'version = "3.7.3"')
          one('README.md', 'Current release: **3.7.2 — Governed Authority, Memory & Evidence**.', 'Current release: **3.7.3 — Governed Authority, Memory & Evidence**.')
          one('scripts/governance-capabilities.py', 'VERSION = "3.7.2"', 'VERSION = "3.7.3"')
          one('scripts/install.sh', 'Installed OpenCode Governance v3.7.2 — Governed Authority, Memory & Evidence.', 'Installed OpenCode Governance v3.7.3 — Governed Authority, Memory & Evidence.')
          one('scripts/install.ps1', 'Installed OpenCode Governance 3.7.2 with routing and capability tools.', 'Installed OpenCode Governance 3.7.3 with routing and capability tools.')

          text = read('scripts/uninstall.sh')
          text = text.replace("if [[ \"$version\" == '3.7.2' ]]; then", "if [[ \"$version\" == '3.7.2' || \"$version\" == '3.7.3' ]]; then")
          text = text.replace('Removed OpenCode Governance 3.7.2 canonical agents, commands, managed routes and managed tools.', 'Removed OpenCode Governance 3.7.3 canonical agents, commands, managed routes and managed tools.')
          write('scripts/uninstall.sh', text)

          text = read('scripts/uninstall.ps1')
          text = text.replace("if([string]$Manifest.governance_version-eq'3.7.2'){", "if([string]$Manifest.governance_version-in@('3.7.2','3.7.3')){")
          text = text.replace('Removed OpenCode Governance 3.7.2 canonical agents, commands, managed routes and managed tools.', 'Removed OpenCode Governance 3.7.3 canonical agents, commands, managed routes and managed tools.')
          write('scripts/uninstall.ps1', text)

          text = read('scripts/verify-routing.sh')
          text = text.replace('|3.7.2);;', '|3.7.2|3.7.3);;')
          text = re.sub(r"(\{[^}\n]*'3\.7\.2')\}", r"\1,'3.7.3'}", text)
          text = text.replace("if version == '3.7.2':\n    resume_markers=", "if version in {'3.7.2','3.7.3'}:\n    resume_markers=")
          text = text.replace(
              "    text=(root/'commands'/'ai-resume.md').read_text(encoding='utf-8')\n    for value in resume_markers:",
              "    if version == '3.7.3': resume_markers += ['LOSSLESS_RESUME_HANDOFF_V1','RESUME_POSTCONDITION_V1','ARCHITECT_NO_PROGRESS','ARCHITECT_CHILD_RESULT_MISSING','ArgumentsFile','TaskId']\n    text=(root/'commands'/'ai-resume.md').read_text(encoding='utf-8')\n    for value in resume_markers:",
          )
          text = text.replace("    if version == '3.7.2':\n        for value in", "    if version in {'3.7.2','3.7.3'}:\n        for value in")
          text = text.replace(
              "            if value not in ps_runner or value not in sh_runner: raise SystemExit(f'Architect runner missing 3.7.2 reliability marker: {value}')",
              "            if value not in ps_runner or value not in sh_runner: raise SystemExit(f'Architect runner missing transactional resume reliability marker: {value}')\n    if version == '3.7.3':\n        for value in ['ARCHITECT_TRANSACTION_V2','ARCHITECT_NO_PROGRESS','ARCHITECT_CHILD_RESULT_MISSING','arguments_sha256','task_id']:\n            if value not in ps_runner or value not in sh_runner: raise SystemExit(f'Architect runner missing 3.7.3 semantic completion marker: {value}')",
          )
          write('scripts/verify-routing.sh', text)

          text = read('scripts/verify-routing.ps1')
          text = re.sub(r"(@\([^\n)]*'3\.7\.2')\)", r"\1,'3.7.3')", text)
          text = text.replace(
              "$ResumeMarkers=$GateMarkers+@('RESUME_MODE_V1','PRE_SIDE_EFFECT','POST_SIDE_EFFECT','TOOL_EXECUTION_ABORTED')",
              "$ResumeMarkers=$GateMarkers+@('RESUME_MODE_V1','PRE_SIDE_EFFECT','POST_SIDE_EFFECT','TOOL_EXECUTION_ABORTED');if($Version-eq'3.7.3'){$ResumeMarkers+=@('LOSSLESS_RESUME_HANDOFF_V1','RESUME_POSTCONDITION_V1','ARCHITECT_NO_PROGRESS','ARCHITECT_CHILD_RESULT_MISSING','ArgumentsFile','TaskId')}",
          )
          text = text.replace(
              "throw \"Architect runner missing 3.7.2 reliability marker: $Value\"}}}",
              "throw \"Architect runner missing transactional resume reliability marker: $Value\"}};if($Version-eq'3.7.3'){foreach($Value in @('ARCHITECT_TRANSACTION_V2','ARCHITECT_NO_PROGRESS','ARCHITECT_CHILD_RESULT_MISSING','arguments_sha256','task_id')){if($PowerShellRunner-notlike\"*$Value*\"-or$UnixRunner-notlike\"*$Value*\"){throw \"Architect runner missing 3.7.3 semantic completion marker: $Value\"}}}}",
          )
          write('scripts/verify-routing.ps1', text)

          text = read('tests/test-governance-capabilities.py').replace('"3.7.2", manifest[', '"3.7.3", manifest[')
          write('tests/test-governance-capabilities.py', text)
          one('tests/test-unified-release.py', 'assert manifest["governance_version"] == "3.7.2"', 'assert manifest["governance_version"] == "3.7.3"')
          write('docs/architect-runner-integration.md', read('docs/architect-runner-integration.md').replace('3.7.2', '3.7.3'))

          changelog = read('CHANGELOG.md')
          section = '''## 3.7.3 - 2026-08-01

- Lossless UTF-8 `/ai-resume` handoff through `ArgumentsFile`, with explicit task binding and prompt/checkpoint hashes in `ARCHITECT_TRANSACTION_V2`.
- Zero-exit/no-progress attempts now fail as `ARCHITECT_NO_PROGRESS`; missing or inconsistent child results fail closed and restore `.ai/**`.
- Windows resolves npm `.ps1`/`.cmd`, WinGet, Scoop and Chocolatey OpenCode launchers automatically; all children run from the canonical project root.
- Successful resume requires persisted task progress plus a matching `GOVERNANCE_RESULT`; validated child output is surfaced to the operator.
- Added Windows and Unix regressions for long Unicode prompts, multiple task checkpoints, no-progress rollback and semantic completion.

'''
          if '## 3.7.3 - 2026-08-01' in changelog:
              raise SystemExit('CHANGELOG already contains 3.7.3')
          anchor = '## 3.7.2 - 2026-08-01\n'
          if anchor not in changelog:
              raise SystemExit('CHANGELOG anchor missing')
          write('CHANGELOG.md', changelog.replace(anchor, section + anchor, 1))

          required = {
              'scripts/verify-routing.sh': ['3.7.3','ARCHITECT_TRANSACTION_V2','ARCHITECT_NO_PROGRESS'],
              'scripts/verify-routing.ps1': ['3.7.3','ARCHITECT_TRANSACTION_V2','ARCHITECT_NO_PROGRESS'],
              'README.md': ['3.7.3'],
              'VERSION': ['3.7.3'],
          }
          for path, markers in required.items():
              data = read(path)
              for marker in markers:
                  if marker not in data: raise SystemExit(f'{path}: missing {marker}')
          PY
          bash -n scripts/verify-routing.sh scripts/install.sh scripts/uninstall.sh
          python3 -m py_compile scripts/governance-capabilities.py tests/test-governance-capabilities.py tests/test-unified-release.py
          rm .github/workflows/apply-v373-version.yml
      - name: Commit release alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION pyproject.toml README.md CHANGELOG.md scripts/governance-capabilities.py scripts/install.sh scripts/install.ps1 scripts/uninstall.sh scripts/uninstall.ps1 scripts/verify-routing.sh scripts/verify-routing.ps1 tests/test-governance-capabilities.py tests/test-unified-release.py docs/architect-runner-integration.md .github/workflows/apply-v373-version.yml
          git commit -m 'release: align OpenCode Governance 3.7.3'
          git push origin HEAD:fix/3.7.3-resume-postcondition
