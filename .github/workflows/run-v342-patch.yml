name: Run observable v3.4.2 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: run-v342-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/v3.4.2-routing-schema-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract the patch and focused validation blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-v342-schema-parity.yml').read_text(encoding='utf-8').splitlines()
          blocks = []
          index = 0
          while index < len(source):
              if source[index].strip() == 'run: |':
                  indent = len(source[index]) - len(source[index].lstrip())
                  index += 1
                  block = []
                  while index < len(source):
                      line = source[index]
                      current = len(line) - len(line.lstrip())
                      if line.strip() and current <= indent:
                          break
                      block.append(line[indent + 2:] if len(line) >= indent + 2 else '')
                      index += 1
                  blocks.append('\n'.join(block) + '\n')
                  continue
              index += 1

          if len(blocks) < 2:
              raise SystemExit(f'Expected at least two executable blocks, found {len(blocks)}.')
          Path('/tmp/v342-apply.sh').write_text('set -euo pipefail\n' + blocks[0], encoding='utf-8')
          Path('/tmp/v342-validate.sh').write_text('set -euo pipefail\n' + blocks[1], encoding='utf-8')
          PY
          chmod +x /tmp/v342-apply.sh /tmp/v342-validate.sh

      - name: Normalize the current Context Intelligence source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          context = Path('scripts/context-intelligence.ps1')
          text = context.read_text(encoding='utf-8')
          old = """        $tokenEstimate=0
                  if(-not[int]::TryParse([string]$skill.estimated_context_tokens,[ref]$tokenEstimate)-or$tokenEstimate-lt0){throw 'SKILL_TOKEN_ESTIMATE_INVALID'}"""
          new = """        $tokenEstimateValue=$skill.estimated_context_tokens
                  if(($tokenEstimateValue-isnot[int]-and$tokenEstimateValue-isnot[long])-or[long]$tokenEstimateValue-lt0-or[long]$tokenEstimateValue-gt[int]::MaxValue){throw 'SKILL_TOKEN_ESTIMATE_INVALID'}
                  $tokenEstimate=[int]$tokenEstimateValue"""
          if text.count(old) != 1:
              raise SystemExit('Current Context Intelligence token-validation block was not found exactly once.')
          text = text.replace(old, new)
          marker = 'estimated_context_tokens=[int]$skill.estimated_context_tokens'
          if text.count(marker) != 1:
              raise SystemExit('Current selected-skill token output was not found exactly once.')
          context.write_text(text.replace(marker, 'estimated_context_tokens=$tokenEstimate'), encoding='utf-8')

          script_path = Path('/tmp/v342-apply.sh')
          script = script_path.read_text(encoding='utf-8')
          start = script.index("context=Path('scripts/context-intelligence.ps1')")
          end = script.index("\n\nps_test=", start)
          script_path.write_text(script[:start] + script[end + 2:], encoding='utf-8')
          PY

      - name: Apply the schema parity patch
        run: /tmp/v342-apply.sh

      - name: Align Unix installer diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/install.sh')
          text = path.read_text(encoding='utf-8')
          old = """enabled=settings.get('enabled_roles');eligible=settings.get('eligible_failures')
          if not isinstance(enabled,list) or any(value not in role_names for value in enabled): raise SystemExit('Routing profile contains an unsupported enabled role.')
          if not isinstance(eligible,list) or any(value not in failures for value in eligible): raise SystemExit('Routing profile contains an unsupported eligible failure.')"""
          new = """enabled=settings.get('enabled_roles');eligible=settings.get('eligible_failures')
          if not isinstance(enabled,list): raise SystemExit('settings.enabled_roles must be an array.')
          if any(value not in role_names for value in enabled): raise SystemExit('Routing profile contains an unsupported enabled role.')
          if not isinstance(eligible,list): raise SystemExit('settings.eligible_failures must be an array.')
          if any(value not in failures for value in eligible): raise SystemExit('Routing profile contains an unsupported eligible failure.')"""
          if text.count(old) != 1:
              raise SystemExit('Unix routing settings validation block was not found exactly once.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Align verifier cooldown marker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'default cooldown must be between 60 and 86400 seconds.'
          new = 'default cooldown must be an integer between 60 and 86400 seconds.'
          for name in ('scripts/verify-routing.ps1', 'scripts/verify-routing.sh'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: legacy cooldown marker was not found exactly once.')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run focused Windows and Unix regressions
        run: /tmp/v342-validate.sh

      - name: Commit the validated patch
        run: |
          rm -f .github/workflows/apply-v342-schema-parity.yml .github/workflows/run-v342-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce cross-platform routing schema parity'
          git push origin HEAD:fix/v3.4.2-routing-schema-parity
