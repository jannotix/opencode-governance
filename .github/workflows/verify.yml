name: Verify governance

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/install.sh scripts/verify.sh scripts/uninstall.sh
      - name: Render and verify configuration
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_DIR="$RUNNER_TEMP/opencode"
          export OPENCODE_CONFIG_DIR="$CONFIG_DIR"
          mkdir -p "$CONFIG_DIR"
          printf '%s\n' \
            'test/architect' 'max' \
            'test/executor' '' \
            'test/reviewer' 'thinking' \
            'test/architecture' 'high' \
            'test/final' 'thinking' \
            | ./scripts/install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in 'scripts/install.ps1','scripts/verify.ps1','scripts/uninstall.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path parse failed: $($errors -join '; ')" }
          }
      - name: Render and verify configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:RUNNER_TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path (Join-Path $config 'agents'), (Join-Path $config 'commands') | Out-Null

          function Render($source, $destination, $modelToken, $model, $variantToken, $variant) {
            $text = Get-Content $source -Raw
            $text = $text.Replace($modelToken, $model)
            $variantLine = if ([string]::IsNullOrWhiteSpace($variant)) { '' } else { "variant: $variant" }
            $text = $text.Replace($variantToken, $variantLine)
            [System.IO.File]::WriteAllText($destination, $text, (New-Object System.Text.UTF8Encoding($false)))
          }

          Render 'templates/agents/architect.md' (Join-Path $config 'agents/architect.md') '__ARCHITECT_MODEL__' 'test/architect' '__ARCHITECT_VARIANT_LINE__' 'max'
          Render 'templates/agents/build.md' (Join-Path $config 'agents/build.md') '__ARCHITECT_MODEL__' 'test/architect' '__ARCHITECT_VARIANT_LINE__' 'max'
          Render 'templates/agents/plan.md' (Join-Path $config 'agents/plan.md') '__ARCHITECT_MODEL__' 'test/architect' '__ARCHITECT_VARIANT_LINE__' 'max'
          Render 'templates/agents/executor.md' (Join-Path $config 'agents/executor.md') '__EXECUTOR_MODEL__' 'test/executor' '__EXECUTOR_VARIANT_LINE__' ''
          Render 'templates/agents/reviewer.md' (Join-Path $config 'agents/reviewer.md') '__REVIEWER_IMPLEMENTATION_MODEL__' 'test/reviewer' '__REVIEWER_IMPLEMENTATION_VARIANT_LINE__' 'thinking'
          Render 'templates/agents/reviewer-architecture.md' (Join-Path $config 'agents/reviewer-architecture.md') '__REVIEWER_ARCHITECTURE_MODEL__' 'test/architecture' '__REVIEWER_ARCHITECTURE_VARIANT_LINE__' 'high'
          Render 'templates/agents/final-reviewer.md' (Join-Path $config 'agents/final-reviewer.md') '__FINAL_REVIEWER_MODEL__' 'test/final' '__FINAL_REVIEWER_VARIANT_LINE__' 'thinking'
          Copy-Item 'templates/commands/*.md' (Join-Path $config 'commands')
          '{"$schema":"https://opencode.ai/config.json","default_agent":"architect"}' | Set-Content -Encoding utf8 (Join-Path $config 'opencode.json')

          ./scripts/verify.ps1 -ConfigDir $config
