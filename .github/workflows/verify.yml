name: Verify governance
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n scripts/install.sh scripts/verify.sh scripts/uninstall.sh
      - name: Render verify and uninstall
        shell: bash
        run: |
          set -euo pipefail
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/opencode"
          mkdir -p "$OPENCODE_CONFIG_DIR/agents" "$OPENCODE_CONFIG_DIR/commands" "$RUNNER_TEMP/project/.ai"
          printf 'user\n' > "$OPENCODE_CONFIG_DIR/agents/unrelated-user-agent.md"
          printf 'user\n' > "$OPENCODE_CONFIG_DIR/commands/unrelated-user-command.md"
          printf 'state\n' > "$RUNNER_TEMP/project/.ai/STATUS.md"
          printf '%s\n' 'test/architect' 'max' 'test/executor' '' 'test/reviewer' 'thinking' 'test/architecture' 'high' 'test/final' 'thinking' | ./scripts/install.sh
          ./scripts/verify.sh "$OPENCODE_CONFIG_DIR"
          test "$(find "$OPENCODE_CONFIG_DIR/agents" -maxdepth 1 -type f -name '*.md' ! -name 'unrelated-user-agent.md' | wc -l)" -eq 7
          test "$(find "$OPENCODE_CONFIG_DIR/commands" -maxdepth 1 -type f -name '*.md' ! -name 'unrelated-user-command.md' | wc -l)" -eq 12
          ./scripts/uninstall.sh
          test -f "$OPENCODE_CONFIG_DIR/agents/unrelated-user-agent.md"
          test -f "$OPENCODE_CONFIG_DIR/commands/unrelated-user-command.md"
          test -f "$RUNNER_TEMP/project/.ai/STATUS.md"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in 'scripts/install.ps1','scripts/verify.ps1','scripts/uninstall.ps1'){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){throw "$path parse failed: $($errors -join '; ')"}
          }
      - name: Install rendered configuration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode'
          New-Item -ItemType Directory -Force -Path (Join-Path $config 'agents'),(Join-Path $config 'commands')|Out-Null
          'user'|Set-Content (Join-Path $config 'agents/unrelated-user-agent.md')
          'user'|Set-Content (Join-Path $config 'commands/unrelated-user-command.md')
          ./scripts/install.ps1 -ConfigDir $config `
            -ArchitectModel 'test/architect' -ArchitectVariant 'max' `
            -ExecutorModel 'test/executor' -ExecutorVariant ([string]::Empty) `
            -ReviewerImplementationModel 'test/reviewer' -ReviewerImplementationVariant 'thinking' `
            -ReviewerArchitectureModel 'test/architecture' -ReviewerArchitectureVariant 'high' `
            -FinalReviewerModel 'test/final' -FinalReviewerVariant 'thinking'
      - name: Verify rendered contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode'
          ./scripts/verify.ps1 -ConfigDir $config
      - name: Verify managed counts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode'
          if((Get-ChildItem (Join-Path $config 'agents') -Filter '*.md'|Where-Object Name -ne 'unrelated-user-agent.md').Count -ne 7){throw 'Expected 7 managed agents'}
          if((Get-ChildItem (Join-Path $config 'commands') -Filter '*.md'|Where-Object Name -ne 'unrelated-user-command.md').Count -ne 12){throw 'Expected 12 managed commands'}
      - name: Uninstall preserves unrelated files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode'
          ./scripts/uninstall.ps1 -ConfigDir $config
          if(-not(Test-Path (Join-Path $config 'agents/unrelated-user-agent.md'))){throw 'Unrelated agent removed'}
          if(-not(Test-Path (Join-Path $config 'commands/unrelated-user-command.md'))){throw 'Unrelated command removed'}
