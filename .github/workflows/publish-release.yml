name: Publish verified release

on:
  workflow_run:
    workflows:
      - Verify repository hardening
    types:
      - completed
    branches:
      - main

concurrency:
  group: publish-governance-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Wait for the complete verification suite
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['RELEASE_SHA']
          required = {
              'Verify governance',
              'Verify repository hardening',
          }
          for _ in range(36):
              payload = subprocess.check_output(
                  ['gh', 'api', f'repos/{repository}/actions/runs?head_sha={sha}&per_page=100'],
                  text=True,
              )
              runs = json.loads(payload).get('workflow_runs', [])
              latest = {}
              for run in runs:
                  name = run.get('name')
                  if name not in required:
                      continue
                  previous = latest.get(name)
                  if previous is None or int(run.get('run_number', 0)) > int(previous.get('run_number', 0)):
                      latest[name] = run
              failed = {
                  name: run.get('conclusion')
                  for name, run in latest.items()
                  if run.get('status') == 'completed' and run.get('conclusion') != 'success'
              }
              if failed:
                  raise SystemExit(f'Verification failed for {sha}: {failed}')
              if required.issubset(latest) and all(latest[name].get('status') == 'completed' and latest[name].get('conclusion') == 'success' for name in required):
                  print(f'All required workflows passed for {sha}.')
                  break
              time.sleep(5)
          else:
              missing = sorted(required.difference(latest))
              pending = sorted(name for name in required.intersection(latest) if latest[name].get('status') != 'completed')
              raise SystemExit(f'Timed out waiting for release verification. Missing={missing}; pending={pending}')
          PY

      - name: Verify release metadata and eligibility
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "Current release: **$version" README.md
          grep -Fq "## $version - " CHANGELOG.md
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          existing="$(git rev-list -n 1 "$version" 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "Version $version is already published at $existing; this verified commit remains unreleased."
            echo 'SHOULD_PUBLISH=false' >> "$GITHUB_ENV"
          else
            echo 'SHOULD_PUBLISH=true' >> "$GITHUB_ENV"
          fi

      - name: Configure release Git identity
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create verified tag
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          existing="$(git rev-list -n 1 "$VERSION" 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "Tag $VERSION already points to $existing instead of $RELEASE_SHA." >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag -a "$VERSION" "$RELEASE_SHA" -m "OpenCode Governance $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Create GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ['VERSION']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(rf'^## {re.escape(version)} - .*?\n\n(.*?)(?=^## |\Z)', text, flags=re.M | re.S)
          if not match:
              raise SystemExit(f'Cannot extract changelog section for {version}.')
          pathlib.Path('/tmp/release-notes.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          PY
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "OpenCode Governance $VERSION" \
            --notes-file /tmp/release-notes.md
