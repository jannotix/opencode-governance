name: Apply v3.7.3 runner fix
on:
  push:
    branches: [fix/3.7.3-resume-postcondition]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.7.3-resume-postcondition
          fetch-depth: 0
      - name: Reconstruct verified runners
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-payload/ps1.part* | base64 -d | gzip -d > scripts/run-governed.ps1
          cat .github/patch-payload/sh.part* | base64 -d | gzip -d > scripts/run-governed.sh
          chmod +x scripts/run-governed.sh
          echo 'e76473f6cdcb06fd58ec8e60b520dff59300ac23e8626693b852dd69a27b1a91  scripts/run-governed.ps1' | sha256sum -c -
          echo '7042ca8274d74992e9f1838515f3f72f967865054f954a3bcbf879924ab9ee66  scripts/run-governed.sh' | sha256sum -c -
          bash -n scripts/run-governed.sh
          rm -rf .github/patch-payload .github/workflows/apply-v373-runner-fix.yml
      - name: Commit verified reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-governed.ps1 scripts/run-governed.sh .github/patch-payload .github/workflows/apply-v373-runner-fix.yml
          git commit -m 'fix: repair runner syntax and v1 transaction compatibility'
          git push origin HEAD:fix/3.7.3-resume-postcondition
