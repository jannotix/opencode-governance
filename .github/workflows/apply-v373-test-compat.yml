name: Apply v3.7.3 test compatibility
on:
  push:
    branches: [fix/3.7.3-resume-postcondition]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.7.3-resume-postcondition
          fetch-depth: 0
      - name: Update legacy resume success fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sh = Path('tests/test-ai-resume-transaction.sh')
          text = sh.read_text(encoding='utf-8')
          replacements = {
          """printf 'success\\n' > \"$project/.ai/RESUME_OK.md\"
          exit 0
          """: """printf 'success\\n' > \"$project/.ai/RESUME_OK.md\"
          python3 - \"$project/.ai/tasks/TASK-001/RUN_STATE.json\" <<'PY_STATE'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          state = json.loads(path.read_text(encoding='utf-8'))
          state['state'] = 'READY_FOR_EXECUTION'
          state['current_phase'] = 'READY_FOR_EXECUTION'
          state['next_required_phase'] = 'IMPLEMENTING'
          path.write_text(json.dumps(state), encoding='utf-8')
          PY_STATE
          printf 'GOVERNANCE_RESULT\\nTASK_ID: TASK-001\\nSTATE: READY_FOR_EXECUTION\\n'
          exit 0
          """,
          """printf 'recovered\\n' > \"$project/.ai/RECOVERED.md\"
          exit 0
          """: """printf 'recovered\\n' > \"$project/.ai/RECOVERED.md\"
          python3 - \"$project/.ai/tasks/TASK-001/RUN_STATE.json\" <<'PY_STATE'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          state = json.loads(path.read_text(encoding='utf-8'))
          state['state'] = 'READY_FOR_EXECUTION'
          state['current_phase'] = 'READY_FOR_EXECUTION'
          state['next_required_phase'] = 'IMPLEMENTING'
          path.write_text(json.dumps(state), encoding='utf-8')
          PY_STATE
          printf 'GOVERNANCE_RESULT\\nTASK_ID: TASK-001\\nSTATE: READY_FOR_EXECUTION\\n'
          exit 0
          """,
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Unix fixture replacement count for {old[:30]!r}: {text.count(old)}')
              text = text.replace(old, new)
          sh.write_text(text, encoding='utf-8')

          ps = Path('tests/test-ai-resume-transaction.ps1')
          text = ps.read_text(encoding='utf-8')
          replacements = {
          """'success'|Set-Content (Join-Path $project '.ai/RESUME_OK.md')
          exit 0
          """: """'success'|Set-Content (Join-Path $project '.ai/RESUME_OK.md')
          $runStatePath=Join-Path $project '.ai/tasks/TASK-001/RUN_STATE.json'
          $runState=Get-Content -LiteralPath $runStatePath -Raw|ConvertFrom-Json
          $runState|Add-Member NoteProperty state 'READY_FOR_EXECUTION' -Force
          $runState.current_phase='READY_FOR_EXECUTION'
          $runState.next_required_phase='IMPLEMENTING'
          $runState|ConvertTo-Json -Depth 10|Set-Content -LiteralPath $runStatePath -Encoding utf8
          Write-Output \"GOVERNANCE_RESULT`nTASK_ID: TASK-001`nSTATE: READY_FOR_EXECUTION\"
          exit 0
          """,
          """'recovered'|Set-Content (Join-Path $project '.ai/RECOVERED.md')
          exit 0
          """: """'recovered'|Set-Content (Join-Path $project '.ai/RECOVERED.md')
          $runStatePath=Join-Path $project '.ai/tasks/TASK-001/RUN_STATE.json'
          $runState=Get-Content -LiteralPath $runStatePath -Raw|ConvertFrom-Json
          $runState|Add-Member NoteProperty state 'READY_FOR_EXECUTION' -Force
          $runState.current_phase='READY_FOR_EXECUTION'
          $runState.next_required_phase='IMPLEMENTING'
          $runState|ConvertTo-Json -Depth 10|Set-Content -LiteralPath $runStatePath -Encoding utf8
          Write-Output \"GOVERNANCE_RESULT`nTASK_ID: TASK-001`nSTATE: READY_FOR_EXECUTION\"
          exit 0
          """,
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Windows fixture replacement count for {old[:30]!r}: {text.count(old)}')
              text = text.replace(old, new)
          ps.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/apply-v373-test-compat.yml
      - name: Commit compatibility update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-ai-resume-transaction.sh tests/test-ai-resume-transaction.ps1 .github/workflows/apply-v373-test-compat.yml
          git commit -m 'test: require semantic completion in resume fixtures'
          git push origin HEAD:fix/3.7.3-resume-postcondition
