name: Verify PowerShell Host and Verifier Reliability v3.3.3+
on:
  push:
  pull_request:

jobs:
  windows-powershell-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install current synthetic routing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'opencode-v333'
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/architect-failover.valid.json')
      - name: Reject Windows PowerShell 5.1 deterministically
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$false
          $config=Join-Path $env:RUNNER_TEMP 'opencode-v333';$project=Join-Path $env:RUNNER_TEMP 'v333-ps51-project'
          New-Item -ItemType Directory -Force -Path (Join-Path $project '.ai')|Out-Null;git -C $project init -q
          'ORIGINAL'|Set-Content -NoNewline (Join-Path $project '.ai/BASELINE.md')
          $output=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $config 'opencode-governance-tools/architect-attempt.ps1') -ProjectDir $project -Command ai-init -Arguments 'synthetic host contract' -RoutingConfigPath (Join-Path $config 'opencode-governance-routing.json') -ConfigDir $config 2>&1
          $code=$LASTEXITCODE;$text=$output-join"`n"
          if($code-eq0){throw 'Windows PowerShell 5.1 unexpectedly ran the Architect runner.'}
          if($text-notmatch'POWERSHELL_7_REQUIRED'){throw "Missing deterministic PowerShell 7 requirement. Output: $text"}
          if((Get-Content (Join-Path $project '.ai/BASELINE.md') -Raw)-ne'ORIGINAL'){throw 'PowerShell host rejection modified .ai state.'}
          $global:LASTEXITCODE=0
      - name: Ignore stale LASTEXITCODE for current verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$config=Join-Path $env:RUNNER_TEMP 'opencode-v333';$global:LASTEXITCODE=73
          & ./scripts/verify-routing.ps1 -ConfigDir $config
          if(-not $?){throw 'Verifier reported failure after a successful PowerShell core verifier.'}
          $global:LASTEXITCODE=0
      - name: Ignore stale LASTEXITCODE for v3.3.0 compatibility verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$source=Join-Path $env:RUNNER_TEMP 'opencode-v333';$config=Join-Path $env:RUNNER_TEMP 'opencode-v333-core'
          New-Item -ItemType Directory -Force -Path (Join-Path $config 'agents'),(Join-Path $config 'opencode-governance-tools')|Out-Null
          Copy-Item (Join-Path $source 'agents/*.md') (Join-Path $config 'agents') -Force
          Copy-Item (Join-Path $source 'opencode-governance-tools/executor-attempt.ps1') (Join-Path $config 'opencode-governance-tools/executor-attempt.ps1') -Force
          Copy-Item (Join-Path $source 'opencode-governance-tools/executor-attempt.sh') (Join-Path $config 'opencode-governance-tools/executor-attempt.sh') -Force
          $manifest=Get-Content (Join-Path $source 'opencode-governance-routing.json') -Raw|ConvertFrom-Json
          $manifest.governance_version='3.3.0'
          foreach($field in 'architect_runner_version','context_intelligence_version','workflow_continuation_version','candidate_authority_version','governed_memory_version','evidence_reuse_version','simulation_harness_version','pre_commit_receipt_gate_version','actionable_continuation_version','capability_tool_hashes','capability_section_hashes','memory_store','capabilities_installed_at'){$manifest.PSObject.Properties.Remove($field)}
          $manifest.managed_tools=@((Join-Path $config 'opencode-governance-tools/executor-attempt.ps1'),(Join-Path $config 'opencode-governance-tools/executor-attempt.sh'))
          $manifest|ConvertTo-Json -Depth 30|Set-Content (Join-Path $config 'opencode-governance-routing.json')
          $global:LASTEXITCODE=74;& ./scripts/verify-routing.ps1 -ConfigDir $config
          if(-not $?){throw 'v3.3.0 compatibility verifier inherited a stale native exit code.'}
          $global:LASTEXITCODE=0
      - name: Ignore stale LASTEXITCODE across install wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$config=Join-Path $env:RUNNER_TEMP 'opencode-v333-install-stale';$installer=Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1';$profile=Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/architect-failover.valid.json'
          $command="`$ErrorActionPreference='Stop';`$global:LASTEXITCODE=75;try{& '$installer' -ConfigDir '$config' -NonInteractive -RoutingConfigPath '$profile';exit 0}catch{Write-Host `$_;exit 1}"
          & pwsh -NoProfile -Command $command
          if($LASTEXITCODE-ne0){throw "Install wrapper inherited stale native exit code: $LASTEXITCODE"}
      - name: Ignore stale LASTEXITCODE across uninstall wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$config=Join-Path $env:RUNNER_TEMP 'opencode-v333-uninstall-stale'
          ./scripts/install.ps1 -ConfigDir $config -NonInteractive -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/architect-failover.valid.json')
          $uninstaller=Join-Path $env:GITHUB_WORKSPACE 'scripts/uninstall.ps1'
          $command="`$ErrorActionPreference='Stop';`$global:LASTEXITCODE=76;try{& '$uninstaller' -ConfigDir '$config';exit 0}catch{Write-Host `$_;exit 1}"
          & pwsh -NoProfile -Command $command
          if($LASTEXITCODE-ne0){throw "Uninstall wrapper inherited stale native exit code: $LASTEXITCODE"}
      - name: Verify release metadata and repository hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content VERSION -Raw).Trim()-ne'3.6.0'){throw 'VERSION must be 3.6.0.'}
          if((Get-Content README.md -Raw)-notmatch'3\.6\.0 — Governed Authority, Memory & Evidence'){throw 'README 3.6.0 marker missing.'}
          if((Get-Content CHANGELOG.md -Raw)-notmatch'(?m)^## 3\.6\.0 - 2026-07-30\r?$'){throw 'CHANGELOG 3.6.0 entry missing.'}
          foreach($path in 'scripts/install.ps1','scripts/uninstall.ps1','scripts/verify-routing.ps1'){
            $text=Get-Content $path -Raw
            if($text-match'(?m)^\s*(?:exit|if\s*\().*\$LASTEXITCODE'){throw "$path still treats stale LASTEXITCODE as a PowerShell child result."}
          }
          $tracked=git ls-files
          if($tracked-match'(^|/)\.ai(/|$)'){throw 'Repository tracks governance runtime state.'}
          if($tracked-match'install-v360|uninstall-v360|verify-v360|governance-runtime-install|test-governance-runtime-install'){throw 'Repository still tracks superseded v360 overlay artifacts.'}
