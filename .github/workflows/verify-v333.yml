name: Verify PowerShell Host and Verifier Reliability v3.3.3
on:
  push:
  pull_request:

jobs:
  windows-powershell-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install synthetic v3.3 routing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:RUNNER_TEMP 'opencode-v333'
          ./scripts/install.ps1 `
            -ConfigDir $config `
            -NonInteractive `
            -RoutingConfigPath (Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/routing/architect-failover.valid.json')

      - name: Reject Windows PowerShell 5.1 deterministically
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:RUNNER_TEMP 'opencode-v333'
          $project = Join-Path $env:RUNNER_TEMP 'v333-ps51-project'
          New-Item -ItemType Directory -Force -Path (Join-Path $project '.ai') | Out-Null
          git -C $project init -q
          'ORIGINAL' | Set-Content -NoNewline (Join-Path $project '.ai/BASELINE.md')
          $runner = Join-Path $config 'opencode-governance-tools/architect-attempt.ps1'
          $manifest = Join-Path $config 'opencode-governance-routing.json'
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner `
            -ProjectDir $project `
            -Command ai-init `
            -Arguments 'synthetic host contract' `
            -RoutingConfigPath $manifest `
            -ConfigDir $config 2>&1
          $code = $LASTEXITCODE
          $text = $output -join "`n"
          if ($code -eq 0) { throw 'Windows PowerShell 5.1 unexpectedly ran the Architect runner.' }
          if ($text -notmatch 'POWERSHELL_7_REQUIRED') { throw "Missing deterministic PowerShell 7 requirement. Output: $text" }
          if ((Get-Content (Join-Path $project '.ai/BASELINE.md') -Raw) -ne 'ORIGINAL') { throw 'PowerShell host rejection modified .ai state.' }

      - name: Ignore stale LASTEXITCODE for v3.3.2 verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:RUNNER_TEMP 'opencode-v333'
          $global:LASTEXITCODE = 73
          & ./scripts/verify-routing.ps1 -ConfigDir $config
          if (-not $?) { throw 'Verifier reported failure after a successful PowerShell core verifier.' }

      - name: Ignore stale LASTEXITCODE for v3.3.0 compatibility verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'opencode-v333'
          $config = Join-Path $env:RUNNER_TEMP 'opencode-v333-core'
          New-Item -ItemType Directory -Force -Path (Join-Path $config 'agents'),(Join-Path $config 'opencode-governance-tools') | Out-Null
          Copy-Item (Join-Path $source 'agents/*.md') (Join-Path $config 'agents') -Force
          Copy-Item (Join-Path $source 'opencode-governance-tools/executor-attempt.ps1') (Join-Path $config 'opencode-governance-tools/executor-attempt.ps1') -Force
          Copy-Item (Join-Path $source 'opencode-governance-tools/executor-attempt.sh') (Join-Path $config 'opencode-governance-tools/executor-attempt.sh') -Force
          $manifest = Get-Content (Join-Path $source 'opencode-governance-routing.json') -Raw | ConvertFrom-Json
          $manifest.governance_version = '3.3.0'
          $manifest.PSObject.Properties.Remove('architect_runner_version')
          $manifest.managed_tools = @(
            (Join-Path $config 'opencode-governance-tools/executor-attempt.ps1'),
            (Join-Path $config 'opencode-governance-tools/executor-attempt.sh')
          )
          $manifest | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $config 'opencode-governance-routing.json')
          $global:LASTEXITCODE = 74
          & ./scripts/verify-routing.ps1 -ConfigDir $config
          if (-not $?) { throw 'v3.3.0 compatibility verifier inherited a stale native exit code.' }

      - name: Verify release metadata and repository hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content VERSION -Raw).Trim() -ne '3.3.3') { throw 'VERSION must be 3.3.3.' }
          if ((Get-Content README.md -Raw) -notmatch '3\.3\.3 — PowerShell Host & Verifier Reliability') { throw 'README 3.3.3 marker missing.' }
          if ((Get-Content CHANGELOG.md -Raw) -notmatch '(?m)^## 3\.3\.3 - 2026-07-29\r?$') { throw 'CHANGELOG 3.3.3 entry missing.' }
          $tracked = git ls-files
          if ($tracked -match '(^|/)\.ai(/|$)') { throw 'Repository tracks governance runtime state.' }
